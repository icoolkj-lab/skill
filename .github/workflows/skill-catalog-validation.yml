name: Skill Catalog Validation
on:
  push:
    paths:
      - "catalog/**"
      - "scripts/**"
      - "**/SKILL.md"
      - ".github/workflows/skill-catalog-validation.yml"
  pull_request:
    paths:
      - "catalog/**"
      - "scripts/**"
      - "**/SKILL.md"
      - ".github/workflows/skill-catalog-validation.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_skill_catalog.py
      - run: python scripts/validate_skill_catalog.py
      - run: python scripts/check_skill_mirrors.py
