name: Skill Catalog Validation
on:
  push:
    paths:
      - "catalog/**"
      - "data/local_skills.json"
      - "public/data/local_skills.json"
      - "README.md"
      - "scripts/**"
      - "**/SKILL.md"
      - ".github/workflows/skill-catalog-validation.yml"
  pull_request:
    paths:
      - "catalog/**"
      - "data/local_skills.json"
      - "public/data/local_skills.json"
      - "README.md"
      - "scripts/**"
      - "**/SKILL.md"
      - ".github/workflows/skill-catalog-validation.yml"
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: skill-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_skill_catalog.py
      - run: python scripts/validate_skill_catalog.py
      - run: python scripts/check_skill_mirrors.py
      - run: python scripts/validate_local_skill_data.py
      - uses: actions/upload-artifact@v4
        with:
          name: provisional-skill-catalog-${{ github.sha }}
          path: catalog/registry.json
          if-no-files-found: error
      - name: Commit updated catalog snapshot on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- catalog/registry.json; then
            echo "Catalog registry is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/registry.json
          git commit -m "chore(catalog): refresh provisional registry [skip ci]"
          git push
